<!doctype html><html lang="bs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Hajz, nifas – istihaza – Ilmihal 3</title><script async src="https://www.googletagmanager.com/gtag/js?id=G-4WRS80K94M"></script><script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-4WRS80K94M');</script><style>body{margin:0;background:#f3ead6;color:#222;font-family:system-ui,Arial}header{background:#265d50;color:white;padding:12px;text-align:center}main{max-width:850px;margin:auto;padding:12px}nav{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}button{border:0;border-radius:10px;background:#286d5b;color:white;padding:12px;font-size:16px;cursor:pointer}button:disabled{opacity:.5}.card{background:#fff9ed;border:1px solid #d4b98b;border-radius:15px;padding:18px;margin:12px 0;box-shadow:0 2px 7px #0001}.option{display:block;width:100%;margin:8px 0;text-align:left;background:#e5dbc6;color:#222}.option.good{background:#9be0ac}.option.bad{background:#ffb3aa}.hide{display:none}h1{font-size:1.5rem}h2{font-size:1.2rem}.muted{color:#625e55}.big{font-size:1.35rem;min-height:110px;display:grid;place-items:center;text-align:center}.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tile{min-height:64px;background:#e6d6b5;color:#222}.tile.sel{outline:4px solid #2a7}.tile.done{opacity:.35}.memory{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.memory button{min-height:70px;background:#d5b989;color:#1c211e;font-size:14px}.memory button.open{background:#fff8e8}.memory button.done{opacity:.25}footer{text-align:center;padding:15px}a{color:#265d50}@media(max-width:500px){.memory{grid-template-columns:repeat(3,1fr)}.pair{grid-template-columns:1fr}button{font-size:15px}}</style></head><body><header><h1>Hajz, nifas – istihaza</h1><small>Ilmihal 3 • Stranica 91 • Pripremio Abdo ef. Rekić</small></header><main><nav><button onclick="show('lesson')">Lekcija</button><button onclick="show('cards')">Kartice</button><button onclick="startQuiz()">Kviz (10)</button><button onclick="startPairs()">Spoji parove</button><button onclick="startMemory()">Memori</button><button onclick="full()">Cijeli ekran</button></nav><section id="lesson"></section><section id="cards" class="hide"><div class="card"><div id="cardCount"></div><div id="flash" class="big" onclick="flip()"></div><nav><button onclick="prevCard()">Prethodna</button><button onclick="flip()">Okreni</button><button onclick="nextCard()">Sljedeća</button></nav></div></section><section id="quiz" class="hide"><div class="card"><div id="progress"></div><h2 id="question"></h2><div id="answers"></div><p id="score"></p></div></section><section id="pairs" class="hide"><div class="card"><h2>Spoji pitanje i odgovor</h2><p>Pronađi 6 odgovarajućih parova.</p><div id="pairArea" class="pair"></div><p id="pairStatus"></p><button onclick="startPairs()">Nova postava</button></div></section><section id="memory" class="hide"><div class="card"><h2>Memori</h2><p>Pronađi 6 parova.</p><div id="memoryArea" class="memory"></div><p id="memoryStatus"></p><button onclick="startMemory()">Nova postava</button></div></section></main><footer><a href="https://rekicabdo-bihac.github.io/mektebski-portal/">Digitalni mektebski centar</a></footer><script>
const data=[{"q": "Koliko može trajati hajz?", "options": ["Od tri do deset dana.", "Od jednog do dva dana.", "Od deset do četrdeset dana.", "Uvijek tačno sedam dana."], "answer": 0}, {"q": "Koliki je najkraći period između dva hajza?", "options": ["Petnaest dana.", "Tri dana.", "Deset dana.", "Četrdeset dana."], "answer": 0}, {"q": "Postoji li najduži ograničeni period između dva hajza?", "options": ["Ne, nema ograničenja.", "Da, deset dana.", "Da, petnaest dana.", "Da, četrdeset dana."], "answer": 0}, {"q": "Koliko najduže može trajati nifas?", "options": ["Četrdeset dana.", "Deset dana.", "Petnaest dana.", "Šezdeset dana."], "answer": 0}, {"q": "Koliko najkraće može trajati nifas?", "options": ["Najkraći period nije ograničen.", "Uvijek najmanje tri dana.", "Uvijek najmanje deset dana.", "Uvijek najmanje petnaest dana."], "answer": 0}, {"q": "Koje su radnje zabranjene ženi tokom hajza i nifasa?", "options": ["Klanjanje, post I spolni odnos.", "Učenje školskog gradiva i razgovor.", "Jelo, piće i spavanje.", "Obavljanje kućnih poslova."], "answer": 0}, {"q": "Treba li naklanjati propuštene namaze tokom hajza i nifasa?", "options": ["Ne, oni  se ne naklanjavaju.", "Da, svaki namaz.", "Da, samo sabah-namaz.", "Da, samo ikindija-namaz."], "answer": 0}, {"q": "Šta je s propuštenim danima posta tokom hajza i nifasa?", "options": ["Dužna ih je napostiti.", "Ne treba ih nikada napostiti.", "Treba ih zamijeniti samo namazom.", "Napostiti samo prvi dan."], "answer": 0}, {"q": "Kada je najbolje napostiti propuštene dane posta?", "options": ["Odmah nakon Ramazanskog bajrama, a najkasnije do sljedećeg ramazana.", "Isključivo tokom ševala a najkasnije do Nove hidzretske godine.", "Samo tokom Kurban-bajrama.", "Tek nakon dvije godine."], "answer": 0}, {"q": "Kakav status ima žena u stanju istihaze?", "options": ["Status sahibi-uzura i dužnost pridržavanja propisa za sahibi-uzur.", "Status žene u hajzu bez obaveze namaza.", "Status žene u nifasu bez obaveze posta.", "Status osobe koja trajno ne mora klanjati."], "answer": 0}], sections=[["Hajz – mjesečnica", "Hajz je mjesečno krvarenje iz maternice odrasle ženske osobe. Može trajati od tri do deset dana. Prva mjesečnica najčešće se pojavljuje između jedanaeste i petnaeste godine, zavisno od klime, ishrane, zdravlja i gena."], ["Razmak između dva hajza", "Najkraći period između dva hajza iznosi petnaest dana, a najduži period nema granice."], ["Nifas – poslijeporođajno krvarenje", "Nifas je krvarenje iz maternice žene odmah nakon poroda. Može trajati do četrdeset dana, a najkraći period nije ograničen."], ["Propisi o namazu i postu", "Ženi u stanju hajza i nifasa zabranjeno je klanjati, postiti i imati spolni odnos. Propuštene namaze nije dužna naklanjati, a propuštene dane posta dužna je napostiti, najbolje odmah nakon Ramazanskog bajrama ili do sljedećeg ramazana."], ["Istihaza", "Istihaza je krvarenje koje nije ni hajz ni nifas. Ako krvarenje traje manje od tri ili više od deset dana, a kod nifasa preko četrdeset dana, žena se smatra sahibi-uzurom i pridržava se propisa vezanih za sahibi-uzur."], ["Hadis o hajzu", "Poslanik, a.s., rekao je: „Najkraći period hajza je tri, a najduži deset dana.“ (Taberani)"]];
const $=id=>document.getElementById(id);let card=0,turned=false,qi=0,points=0,lock=false,pick=null,matched=0,memFirst=null,memLock=false,memMatched=0;
function beep(ok){try{let a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=ok?740:240;o.connect(g);g.connect(a.destination);g.gain.value=.06;o.start();o.stop(a.currentTime+.13)}catch(e){}}
function full(){document.documentElement.requestFullscreen?.().catch(()=>{})}
function show(id){for(let s of document.querySelectorAll('main section'))s.classList.toggle('hide',s.id!==id);window.scrollTo(0,0);if(id==='cards')renderCard()}
$('lesson').innerHTML=sections.map(([h,t])=>`<article class="card"><h2>${h}</h2><p>${t}</p></article>`).join('');
function renderCard(){$('cardCount').textContent=`Kartica ${card+1} / ${data.length}`;$('flash').textContent=turned?data[card].options[data[card].answer]:data[card].q}function flip(){turned=!turned;renderCard()}function nextCard(){card=(card+1)%data.length;turned=false;renderCard()}function prevCard(){card=(card+data.length-1)%data.length;turned=false;renderCard()}
function startQuiz(){qi=0;points=0;show('quiz');renderQuiz()}function renderQuiz(){lock=false;if(qi===data.length){$('progress').textContent='Kviz završen';$('question').textContent=`Rezultat: ${points} bodova`;$('answers').innerHTML='<button onclick="startQuiz()">Ponovi kviz</button>';$('score').textContent='';return}let d=data[qi];$('progress').textContent=`Pitanje ${qi+1} / ${data.length}`;$('question').textContent=d.q;$('score').textContent=`Bodovi: ${points}`;let order=[0,1,2,3].sort(()=>Math.random()-.5);$('answers').innerHTML='';order.forEach(i=>{let b=document.createElement('button');b.className='option';b.textContent=d.options[i];b.onclick=()=>{if(lock)return;lock=true;let ok=i===d.answer;points+=ok?10:-3;beep(ok);b.classList.add(ok?'good':'bad');[...$('answers').children].forEach(x=>x.disabled=true);setTimeout(()=>{qi++;renderQuiz()},850)};$('answers').appendChild(b)})}
function sample(){return [...data.keys()].sort(()=>Math.random()-.5).slice(0,6)}
function startPairs(){show('pairs');matched=0;pick=null;let ids=sample(),items=ids.flatMap(i=>[{i,kind:'q',txt:data[i].q},{i,kind:'a',txt:data[i].options[data[i].answer]}]).sort(()=>Math.random()-.5);$('pairArea').innerHTML='';$('pairStatus').textContent='Spojeno: 0 / 6';items.forEach(it=>{let b=document.createElement('button');b.className='tile';b.textContent=it.txt;b.onclick=()=>{if(b.classList.contains('done'))return;if(!pick){pick={it,b};b.classList.add('sel');return}if(pick.b===b){b.classList.remove('sel');pick=null;return}if(pick.it.i===it.i&&pick.it.kind!==it.kind){b.classList.add('done');pick.b.classList.remove('sel');pick.b.classList.add('done');matched++;beep(true);$('pairStatus').textContent=`Spojeno: ${matched} / 6${matched===6?' – Bravo!':''}`}else{pick.b.classList.remove('sel');beep(false)}pick=null};$('pairArea').appendChild(b)})}
function startMemory(){show('memory');memFirst=null;memLock=false;memMatched=0;let ids=sample(),items=ids.flatMap(i=>[{i,kind:'q',txt:data[i].q},{i,kind:'a',txt:data[i].options[data[i].answer]}]).sort(()=>Math.random()-.5);$('memoryArea').innerHTML='';$('memoryStatus').textContent='Parovi: 0 / 6';items.forEach((it,j)=>{let b=document.createElement('button');b.textContent=j+1;b.onclick=()=>{if(memLock||b.classList.contains('done')||b.classList.contains('open'))return;b.classList.add('open');b.textContent=it.txt;if(!memFirst){memFirst={it,b,j};return}let prev=memFirst;memFirst=null;if(prev.it.i===it.i&&prev.it.kind!==it.kind){b.classList.add('done');prev.b.classList.add('done');memMatched++;beep(true);$('memoryStatus').textContent=`Parovi: ${memMatched} / 6${memMatched===6?' – Bravo!':''}`}else{memLock=true;beep(false);setTimeout(()=>{b.classList.remove('open');prev.b.classList.remove('open');b.textContent=j+1;prev.b.textContent=prev.j+1;memLock=false},1100)}};$('memoryArea').appendChild(b)})}
show('lesson');
</script></body></html>
